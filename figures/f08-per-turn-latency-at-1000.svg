<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
<title id="title">TTFT p90 and ITL p90 by turn index at 1,000 concurrent sessions</title>
<desc id="desc">Two panels by turn index within a session (0-based). TTFT p90 climbs turn after turn on both configurations and never levels off; the runs stopped at their time cap after turn 4 (TP8 BF16) and turn 5 (TP8+EP8 FP8), so whole-run percentiles at 1,000 sessions are lower bounds. ITL p90 stays between 182 and 279 ms on every turn, several times the 50 ms SLO.</desc>
<!--
Data sources (every number in this figure is read from these files):
  data/vllm-tp8-matrix/AG-c1000-t8/records.jsonl.gz (per-turn p90, nearest rank)
  data/vllm-tp8ep8-fp8kv/AG-c1000-t8/records.jsonl.gz (per-turn p90, nearest rank)
-->
