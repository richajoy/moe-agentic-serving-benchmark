<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">Measured operating frontier for agentic serving on one 8x H100 node: throughput per GPU versus per-user speed</title>
<desc id="desc">Each of the 21 eight-turn agentic points is plotted as output tokens per second per GPU against tokens per second per user (1000 / ITL p90). Solid markers meet the target: at least 90% of requests met TTFT 2 s and ITL 50 ms. Hollow markers did not. Only two points are on the frontier: TP8+EP8 BF16 KV at 64 sessions (39.0 tok/s/user, 243.6 tok/s/GPU, 100% in SLO) and TP8+EP8 FP8 KV at 256 sessions (17.7 tok/s/user, 401.9 tok/s/GPU, 18.4% in SLO). Concurrencies 96 to 192 were not measured, so the curve between them is unknown. Dashed lines mark 20 tok/s/user (the 50 ms ITL SLO) and the InferenceX reference tiers of 35 and 50 tok/s/user.</desc>
<!--
Data sources (every measured number in this animation is read from these files):
  data/points.json: every row whose point name ends in -t8 (out_tok_s_gpu, tok_s_user_p90, slo_ok_pct, ttft_p90_ms)
  Reference tiers: InferenceX calculator default 35 tok/s/user and default tier 50 tok/s/user (docs/07-how-this-compares.md)
-->
