<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">Data-parallel ranks: vLLM's balancer scatters a session's turns, the Dynamo KV router keeps them on one rank</title>
<desc id="desc">Two panels of 8 data-parallel ranks. Left: vLLM's internal balancer sends each turn of one session to a different rank, so most turns miss their history: prefix hit 49.2%, TTFT p90 4.53 s, ITL p90 41.4 ms at 64 sessions. Right: the Dynamo KV router sends turns to the rank that holds the session's blocks: hit 70.0%, TTFT p90 2.69 s, ITL p90 36.6 ms.</desc>
<!--
Data sources (every measured number in this animation is read from these files):
  data/points.json vllm-dp8ep8/AG-c64-t8, vllm-dp8ep8-kvrouter/AG-c64-t8, and both AG-c256-t8 rows
  data/configs/vllm-dp8ep8*/cmd.txt (router mode); the ranks chosen for the one session drawn are illustrative
-->
