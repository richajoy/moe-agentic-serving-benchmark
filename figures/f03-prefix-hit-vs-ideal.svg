<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">Measured prefix-cache hit rate versus the ideal for each agentic point</title>
<desc id="desc">One row per agentic point. A tick marks the ideal hit rate for the session length (84.2% for 4 turns, 88.9% for 8, 94.1% for 20) and a dot marks the measured value. While the KV pool has room the measured hit matches the ideal (84.0 to 94.4%). When the pool is full, when a data-parallel balancer scatters a session's turns, or when both P/D pools evict at 256 sessions, it falls to 37.6 to 71.4%.</desc>
<!--
Data sources (every number in this figure is read from these files):
  data/points.json hit_pct, kv_max for: vllm-tp8/AG-c16-t4, vllm-tp8/AG-c64-t8, vllm-tp8ep8/AG-c64-t8, trtllm-tp8ep8/AG-c64-t8, vllm-pd-1p1d-fp8kv/AG-c64-t8, vllm-tp8-matrix/AG-c64-t20, vllm-tp8ep8-fp8kv/AG-c256-t8, vllm-dp8ep8-kvrouter/AG-c64-t8, vllm-dp8ep8/AG-c64-t8, vllm-pd-1p1d/AG-c64-t8, vllm-tp8ep8/AG-c256-t8, trtllm-tp8ep8/AG-c256-t8, vllm-tp8/AG-c256-t8, vllm-tp8ep8-fp8kv/AG-c1000-t8, vllm-tp8-matrix/AG-c1000-t8, vllm-pd-1p1d-fp8kv/AG-c256-t8, vllm-dp8ep8/AG-c256-t8
  Ideal: 1 - 600n / (sum of n turn inputs), docs/00-method.md
-->
