<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="title desc">
<title id="title">Knob map: measured effect of each single change on TTFT p90, ITL p90, output throughput and goodput</title>
<desc id="desc">A table of colored cells. Each row is one change from a baseline point to a variant point; each cell shows baseline and variant and the percent change, blue when the change helps and red when it hurts, with latency signs flipped so lower latency counts as better. FP8 KV is the only change that helps all four columns by a large margin; P/D trades TTFT and throughput for ITL; going from 64 to 256 sessions on BF16 KV hurts everything.</desc>
<!--
Data sources (every number in this figure is read from these files):
  data/points.json rows: vllm-tp8ep8/AG-c256-t8 -> vllm-tp8ep8-fp8kv/AG-c256-t8; vllm-tp8/AG-c64-t8 -> vllm-tp8ep8/AG-c64-t8; vllm-tp8/AG-c64-t8 -> vllm-dp8ep8/AG-c64-t8; vllm-dp8ep8/AG-c64-t8 -> vllm-dp8ep8-kvrouter/AG-c64-t8; vllm-tp8-moe-default/S2-c16 -> vllm-tp8-moe-tuned/S2-c16; vllm-tp8-moe-default/AG-c64-t8 -> vllm-tp8-moe-tuned/AG-c64-t8; vllm-tp8ep8/AG-c64-t8 -> trtllm-tp8ep8/AG-c64-t8; vllm-tp8ep8/AG-c64-t8 -> vllm-pd-1p1d/AG-c64-t8; vllm-tp8ep8-fp8kv/AG-c256-t8 -> vllm-pd-1p1d-fp8kv/AG-c256-t8; vllm-tp8/AG-c64-t8 -> vllm-tp8-matrix/AG-c64-t20; vllm-tp8/AG-c64-t8 -> vllm-tp8/AG-c256-t8
-->
