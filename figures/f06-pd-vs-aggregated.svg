<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
<title id="title">Aggregated serving versus prefill/decode disaggregation (1 prefill : 1 decode) on agentic load</title>
<desc id="desc">Three panels of bars: TTFT p90 (log seconds), ITL p90 (ms) and output tokens per second per GPU. At 256 sessions with FP8 KV, P/D cuts ITL p90 from 56.4 to 38.5 ms but raises TTFT p90 from 4.1 s to at least 44.4 s (the P/D run hit its time cap) and cuts output from 401.9 to 167.5 tok/s/GPU. At 64 sessions the two are close; P/D with BF16 KV has a TTFT p90 of 3.25 s versus 0.85 s aggregated.</desc>
