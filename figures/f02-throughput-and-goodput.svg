<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="title desc">
<title id="title">Output throughput per GPU and goodput per GPU versus concurrent agentic sessions</title>
<desc id="desc">Two panels. Left: output tokens per second per GPU. Right: goodput, requests per second per GPU that met TTFT 2 s and ITL 50 ms. FP8 KV gives the most throughput (401.9 output tok/s/GPU at 256 sessions) but goodput peaks at 64 sessions (1.218 req/s/GPU on TP8+EP8 BF16 KV) and is zero at 1,000 sessions.</desc>
<!--
Data sources (every number in this figure is read from these files):
  data/points.json rows: vllm-tp8/AG-c16-t4, vllm-tp8/AG-c64-t8, vllm-tp8/AG-c256-t8, vllm-tp8-matrix/AG-c512-t8, vllm-tp8-matrix/AG-c1000-t8, vllm-tp8ep8/AG-c64-t8, vllm-tp8ep8/AG-c256-t8, vllm-tp8ep8-fp8kv/AG-c256-t8, vllm-tp8ep8-fp8kv/AG-c1000-t8
-->
