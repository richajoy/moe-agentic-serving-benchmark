<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">Qwen3-235B FP8 on pure TP8: 1536 / 8 = 192 forces [64,64] scale blocks and a default Triton config; TP8+EP8 keeps native [128,128]</title>
<desc id="desc">Left: pure TP8 splits each expert's 1536-wide intermediate dimension into 8 slices of 192. 192 is not a multiple of the checkpoint's 128-wide FP8 scale block, so vLLM refines the scales to [64,64] blocks, which only its Triton MoE kernel accepts, and vLLM 0.31.0 ships no tuned Triton config for that shape on H100, so it logs that it uses a default config. Right: TP8 attention plus EP8 experts gives each GPU 16 whole experts, native [128,128] blocks and the FLASHINFER_CUTLASS kernel. Measured on the prefill-heavy S2 shape at 16 concurrent requests: 1.00 to 1.19 req/s, TTFT p90 4.75 s to 3.71 s, ITL p90 54.5 to 45.9 ms.</desc>
<!--
Data sources (every measured number in this animation is read from these files):
  data/points.json vllm-tp8-matrix/S2-c16, vllm-tp8ep8/S2-c16
  data/engine-startup.json moe_backend and moe_block_refinement for vllm-tp8 and vllm-tp8ep8
  Model config: 128 experts, expert intermediate size 1536
-->
