<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
<title id="title">Agentic TTFT p90 and ITL p90 as concurrent sessions grow, three layouts</title>
<desc id="desc">Two log-scale panels. TTFT p90 in seconds and ITL p90 in milliseconds versus 16 to 1,000 concurrent agentic sessions on one 8x H100 node. Markers are p90; thin bars span p50 to p99. At 64 sessions every layout is inside the SLO (TP8+EP8 BF16 KV: TTFT p90 0.85 s, ITL p90 25.6 ms). At 256 sessions every layout misses it at p90; FP8 KV comes closest (TTFT p90 4.1 s, ITL p90 56.4 ms). At 1,000 sessions TTFT p90 is 72.5 s or more and ITL p90 265 ms or more, and both runs are lower bounds.</desc>
<!--
Data sources (every number in this figure is read from these files):
  data/points.json rows: vllm-tp8/AG-c16-t4, vllm-tp8/AG-c64-t8, vllm-tp8/AG-c256-t8, vllm-tp8-matrix/AG-c512-t8, vllm-tp8-matrix/AG-c1000-t8, vllm-tp8ep8/AG-c64-t8, vllm-tp8ep8/AG-c256-t8, vllm-tp8ep8-fp8kv/AG-c256-t8, vllm-tp8ep8-fp8kv/AG-c1000-t8
-->
