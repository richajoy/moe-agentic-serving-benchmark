<rect x="882.5" y="196.0" width="32.0" height="22.0" rx="2" class="c3" />
<text x="506.0" y="250.0" class="ink" text-anchor="start" >no refinement and no default-config warning in the log</text>
<text x="506.0" y="314.0" class="ink" text-anchor="start" >native 128 blocks keep the faster kernels eligible</text>
<text x="506.0" y="334.0" class="ink h" text-anchor="start" >→ FLASHINFER_CUTLASS FP8 MoE backend</text>
<text x="506.0" y="366.0" class="ink" text-anchor="start" >Measured end to end, S2 (16,384 in / 256 out), 16 concurrent:</text>
<text x="506.0" y="390.0" class="cg big" text-anchor="start" >1.00 → 1.19 req/s (+19%)</text>
<text x="506.0" y="412.0" class="ink h" text-anchor="start" >TTFT p90 4.75 s → 3.71 s, ITL p90 54.5 → 45.9 ms</text>
<g class="k8 motion" opacity="0"><rect x="0" y="0" width="432" height="58" rx="6" fill="none" class="sy" stroke-width="3"/></g>
<text x="24.0" y="509.0" class="faint xs" text-anchor="start" >The end-to-end gain also includes the change in MoE communication (all-to-all instead of all-reduce), so it is not the kernel alone.</text>
<text x="24.0" y="526.0" class="faint xs" text-anchor="start" >Qwen3-235B-A22B-Instruct-2507 FP8 | 8x H100 SXM5 | Dynamo 1.6.0 + vLLM 0.31.0 | single runs</text>
