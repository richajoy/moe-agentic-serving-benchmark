<text x="722.0" y="108.0" class="ink h" text-anchor="start" >How to read it</text>
<text x="722.0" y="132.0" class="ink s" text-anchor="start" >Up = more output per GPU</text>
<text x="722.0" y="151.0" class="ink s" text-anchor="start" >(cheaper tokens).</text>
<text x="722.0" y="170.0" class="ink s" text-anchor="start" >Right = faster streaming</text>
<text x="722.0" y="189.0" class="ink s" text-anchor="start" >for the slowest 10% of users.</text>
<text x="722.0" y="208.0" class="ink s" text-anchor="start" >Solid = meets the target:</text>
<text x="722.0" y="227.0" class="ink s" text-anchor="start" >at least 90% of requests had</text>
<text x="722.0" y="246.0" class="ink s" text-anchor="start" >TTFT ≤ 2 s and ITL ≤ 50 ms.</text>
<text x="722.0" y="265.0" class="ink s" text-anchor="start" >Hollow = fewer.</text>
<text x="722.0" y="284.0" class="ink s" text-anchor="start" ></text>
<text x="722.0" y="303.0" class="ink s" text-anchor="start" >Every point past 64</text>
<text x="722.0" y="322.0" class="ink s" text-anchor="start" >sessions is hollow: the</text>
<text x="722.0" y="341.0" class="ink s" text-anchor="start" >last load that meets the</text>
<text x="722.0" y="360.0" class="ink s" text-anchor="start" >target lies between 64</text>
<text x="722.0" y="379.0" class="ink s" text-anchor="start" >and 256 sessions.</text>
