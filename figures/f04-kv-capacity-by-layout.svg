<text x="900.0" y="374.0" class="c4 s" text-anchor="end" >1,000-session demand (6.4M to 8.4M tokens) is off the scale →</text>
<text x="24.0" y="402.0" class="faint xs" text-anchor="start" >Demand band is arithmetic (8,400 tokens at session end), so it overstates the average resident context.</text>
<text x="24.0" y="418.0" class="faint xs" text-anchor="start" >Qwen3-235B-A22B-Instruct-2507 FP8 | one node, 8x H100 SXM5 | Dynamo 1.6.0 | single run per point. GPU memory utilization 0.92, block size 64.</text>
