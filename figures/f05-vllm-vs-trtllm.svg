<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="title desc">
<title id="title">vLLM 0.31.0 versus TensorRT-LLM 1.3.0rc29 at TP8+EP8: TTFT p90 and ITL p90 at four points</title>
<desc id="desc">Grouped bars, vLLM blue and TensorRT-LLM orange, p90 with a dark tick at p50. TTFT p90 in seconds: S2-c16 3.71 vs 3.61, AG-c64 0.85 vs 0.73, S1-c64 1.13 vs 1.04, AG-c256 13.96 vs 14.59. ITL p90 in ms: S2-c16 45.9 vs 45.5, AG-c64 25.6 vs 27.7, S1-c64 20.0 vs 23.6, AG-c256 164.6 vs 142.7. Neither engine wins both panels; most gaps are within run-to-run noise for single runs.</desc>
