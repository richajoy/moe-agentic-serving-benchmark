<text x="506.0" y="186.0" class="ink" text-anchor="start" >each keeps 1536 = 12 x 128: native [128, 128] blocks</text>
<rect x="514.0" y="196.0" width="32.0" height="22.0" rx="2" class="c3" />
<rect x="547.5" y="196.0" width="32.0" height="22.0" rx="2" class="c3" />
