<text x="510.0" y="382.0" class="ink h" text-anchor="start" >prefix hit 70.0%, requests in SLO 64%</text>
<text x="510.0" y="400.0" class="ink s" text-anchor="start" >TTFT p90 2.69 s, ITL p90 36.6 ms (measured, 64 sessions)</text>
<text x="24.0" y="438.0" class="ink" text-anchor="start" >Left: turns land on ranks that never saw the session, so its history is prefilled again. Right: the router scores each rank's</text>
<text x="24.0" y="456.0" class="ink" text-anchor="start" >cached blocks and picks the owner. Still below the 88.9% ideal (KV peak was only 0.51, so this is routing, not capacity).</text>
<text x="24.0" y="474.0" class="ink" text-anchor="start" >At 256 sessions routing cannot help: both full, hit 37.6% vs 40.4%.</text>
