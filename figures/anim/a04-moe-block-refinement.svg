<text x="24.0" y="32.0" class="ink t" text-anchor="start" >Why pure TP8 runs this FP8 MoE on an untuned kernel, and TP8+EP8 does not</text>
<text x="24.0" y="54.0" class="mut" text-anchor="start" >Expert FFN intermediate size 1536; the checkpoint's FP8 weight scales cover [128 x 128] blocks</text>
<rect x="24.0" y="66.0" width="444.0" height="384.0" rx="8" class="pan" />
<rect x="492.0" y="66.0" width="444.0" height="384.0" rx="8" class="pan" />
<text x="38.0" y="90.0" class="ink h" text-anchor="start" >Pure TP8 (each expert sliced 8 ways)</text>
<text x="506.0" y="90.0" class="ink h" text-anchor="start" >TP8 attention + EP8 experts (whole experts per GPU)</text>
<text x="38.0" y="118.0" class="ink" text-anchor="start" >1536 / 8 GPUs = 192 columns per GPU</text>
<g class="k0"><rect x="46.0" y="128.0" width="49.0" height="22.0" rx="2" class="c1" /><text x="71.0" y="144.0" class="w s" text-anchor="middle" >192</text></g>
<g class="k1"><rect x="96.0" y="128.0" width="49.0" height="22.0" rx="2" class="c1" /><text x="121.0" y="144.0" class="w s" text-anchor="middle" >192</text></g>
<g class="k2"><rect x="146.0" y="128.0" width="49.0" height="22.0" rx="2" class="c1" /><text x="171.0" y="144.0" class="w s" text-anchor="middle" >192</text></g>
<g class="k3"><rect x="196.0" y="128.0" width="49.0" height="22.0" rx="2" class="c1" /><text x="221.0" y="144.0" class="w s" text-anchor="middle" >192</text></g>
<g class="k4"><rect x="246.0" y="128.0" width="49.0" height="22.0" rx="2" class="c1" /><text x="271.0" y="144.0" class="w s" text-anchor="middle" >192</text></g>
<g class="k5"><rect x="296.0" y="128.0" width="49.0" height="22.0" rx="2" class="c1" /><text x="321.0" y="144.0" class="w s" text-anchor="middle" >192</text></g>
<g class="k6"><rect x="346.0" y="128.0" width="49.0" height="22.0" rx="2" class="c1" /><text x="371.0" y="144.0" class="w s" text-anchor="middle" >192</text></g>
<g class="k7"><rect x="396.0" y="128.0" width="49.0" height="22.0" rx="2" class="c1" /><text x="421.0" y="144.0" class="w s" text-anchor="middle" >192</text></g>
<text x="38.0" y="186.0" class="ink" text-anchor="start" >192 is not a multiple of the 128-wide scale block:</text>
<rect x="46.0" y="196.0" width="204.8" height="22.0" rx="2" class="c1" />
<text x="148.4" y="212.0" class="w s" text-anchor="middle" >128</text>
<rect x="252.8" y="196.0" width="102.4" height="22.0" rx="2" class="cr" />
<text x="304.0" y="212.0" class="w s" text-anchor="middle" >64 left over</text>
<text x="38.0" y="250.0" class="ink" text-anchor="start" >vLLM refines the scales: gcd(128, 192) = 64, block [64, 64]</text>
<rect x="46.0" y="260.0" width="102.4" height="22.0" rx="2" class="c3" />
<text x="97.0" y="276.0" class="w s" text-anchor="middle" >64</text>
<rect x="150.4" y="260.0" width="102.4" height="22.0" rx="2" class="c3" />
<text x="201.4" y="276.0" class="w s" text-anchor="middle" >64</text>
<rect x="254.8" y="260.0" width="102.4" height="22.0" rx="2" class="c3" />
<text x="305.8" y="276.0" class="w s" text-anchor="middle" >64</text>
<text x="38.0" y="314.0" class="ink" text-anchor="start" >Only the Triton MoE kernel accepts [64,64] blocks</text>
<text x="38.0" y="334.0" class="ink h" text-anchor="start" >→ TRITON FP8 MoE backend</text>
<text x="38.0" y="366.0" class="ink" text-anchor="start" >Tuned-config lookup for this shape on H100:</text>
<text x="38.0" y="384.0" class="ink mono" text-anchor="start" >E=128,N=192,device_name=NVIDIA_H100_80GB_HBM3,</text>
<text x="38.0" y="400.0" class="ink mono" text-anchor="start" >dtype=fp8_w8a8,block_shape=[64,64].json</text>
<text x="38.0" y="426.0" class="cr h" text-anchor="start" >not shipped → vLLM logs 'Using default MoE config'</text>
<text x="506.0" y="118.0" class="ink" text-anchor="start" >128 experts / 8 GPUs = 16 whole experts per GPU</text>
<rect x="514.0" y="128.0" width="22.0" height="22.0" rx="2" class="c1" />
